server:
    port: 8081
    shutdown: graceful # finish in-flight requests before shutting down

spring:
    application:
        name: catalog-service
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/catalog
        username: ${DB_USER:shopflow}
        password: ${DB_PASSWORD:shopflow}
        hikari:
            maximum-pool-size: 10
            connection-timeout: 3000 # fail fast instead of hanging when the DB is unreachable
    jpa:
        open-in-view: false # never hold a DB connection while rendering the HTTP response
        hibernate:
            ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches

