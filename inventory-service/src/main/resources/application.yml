server:
    port: 8082
    shutdown: graceful # finish in-flight requests before shutting down

spring:
    application:
        name: inventory-service
    threads:
        virtual:
            enabled: true
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:5432/inventory
        username: ${DB_USER:shopflow}
        password: ${DB_PASSWORD:shopflow}
        hikari:
            maximum-pool-size: 10
            connection-timeout: 3000
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate