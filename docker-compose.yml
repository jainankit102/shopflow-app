# =============================================================================
# ShopFlow - full local platform
#   docker compose up -d --build        build images and start everything
#   docker compose ps                   status + health of every container
#   docker compose logs -f order-service
#   docker compose up -d --scale order-service=3   (more replicas, Eureka load-balances)
#   docker compose down -v              stop and delete volumes (fresh start)
# Needs ~8 GB of RAM for Docker. See README.md for a lighter "core only" option.
# =============================================================================
name: shopflow

# ---- reusable snippets (YAML anchors) ----
x-app: &app
  restart: unless-stopped
  environment: &app-env
    DB_HOST: postgres
    REDIS_HOST: redis
    MONGO_HOST: mongo
    KAFKA_BOOTSTRAP: kafka:9092
    EUREKA_URL: http://discovery-server:8761/eureka/
    OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    # Uncomment for JSON logs (what you'd ship to Loki / ELK / Splunk in production):
    # LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  deploy:
    resources:
      limits:
        memory: 512M
  depends_on: &app-deps
    discovery-server: { condition: service_healthy }
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    redis: { condition: service_healthy }
    mongo: { condition: service_healthy }

x-healthcheck: &actuator-health
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 40s

services:
  # ===================== infrastructure =====================
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: shopflow
      MONGO_INITDB_ROOT_PASSWORD: shopflow
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    # KRaft mode: Kafka manages its own metadata (no ZooKeeper since Kafka 4.0).
    # Two listeners: PLAINTEXT for containers (kafka:9092), EXTERNAL for your laptop (localhost:29092).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["29092:29092"]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    environment:
      KAFKA_CLUSTERS_0_NAME: shopflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8089:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  # ===================== observability =====================
  jaeger:
    image: jaegertracing/jaeger:2.15.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP (apps send spans here)

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["3000:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, jaeger]

  # ===================== platform services =====================
  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    image: shopflow/discovery-server:1.0.0
    restart: unless-stopped
    ports: ["8761:8761"]
    deploy: { resources: { limits: { memory: 384M } } }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]

  api-gateway:
    <<: *app
    build: { context: ., args: { MODULE: api-gateway } }
    image: shopflow/api-gateway:1.0.0
    ports: ["8080:8080"]
    depends_on:
      discovery-server: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]

  # ===================== business services =====================
  # No host ports: only the gateway is public. Replicas get distinct IPs and register in Eureka.
  catalog-service:
    <<: *app
    build: { context: ., args: { MODULE: catalog-service } }
    image: shopflow/catalog-service:1.0.0
    deploy:
      replicas: 2
      resources: { limits: { memory: 512M } }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]

  inventory-service:
    <<: *app
    build: { context: ., args: { MODULE: inventory-service } }
    image: shopflow/inventory-service:1.0.0
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]

  order-service:
    <<: *app
    build: { context: ., args: { MODULE: order-service } }
    image: shopflow/order-service:1.0.0
    deploy:
      replicas: 2
      resources: { limits: { memory: 512M } }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health/readiness"]

  payment-service:
    <<: *app
    build: { context: ., args: { MODULE: payment-service } }
    image: shopflow/payment-service:1.0.0
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health/readiness"]

  notification-service:
    <<: *app
    build: { context: ., args: { MODULE: notification-service } }
    image: shopflow/notification-service:1.0.0
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health/readiness"]

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
