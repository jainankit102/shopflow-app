# Prometheus PULLS metrics: every 5s it scrapes /actuator/prometheus on every replica of every service.
# dns_sd_configs asks Docker DNS for all IPs behind a service name, so `--scale order-service=3`
# is picked up automatically within 10s. On Kubernetes you would use kubernetes_sd_configs instead.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: api-gateway
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - api-gateway
    type: A
    port: 8080
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: api-gateway
- job_name: catalog-service
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - catalog-service
    type: A
    port: 8081
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: catalog-service
- job_name: inventory-service
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - inventory-service
    type: A
    port: 8082
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: inventory-service
- job_name: order-service
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - order-service
    type: A
    port: 8083
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: order-service
- job_name: payment-service
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - payment-service
    type: A
    port: 8084
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: payment-service
- job_name: notification-service
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - notification-service
    type: A
    port: 8085
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: notification-service
- job_name: discovery-server
  metrics_path: /actuator/prometheus
  dns_sd_configs:
  - names:
    - discovery-server
    type: A
    port: 8761
    refresh_interval: 10s
  relabel_configs:
  - target_label: application
    replacement: discovery-server
